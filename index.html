<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>امتحان تكنولوجيا المعلومات – الصف الثامن</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a14;--sf:#12121f;--acc:#4cc9f0;--grn:#4ade80;--red:#f87171;--yel:#fbbf24;--pur:#c084fc;--txt:#e8e8f4;--mut:#6b6b8a}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* ── INTRO ── */
#intro{align-items:center;justify-content:center;padding:28px 20px;
  background:radial-gradient(ellipse at top,#1a1a3e 0%,var(--bg) 70%);overflow-y:auto}
.intro-card{background:var(--sf);border:1px solid rgba(76,201,240,.2);border-radius:20px;
  padding:28px 24px;max-width:480px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.intro-logo{font-size:56px;text-align:center;display:block;animation:floatE 2.5s ease-in-out infinite;margin-bottom:12px}
.intro-title{font-size:20px;font-weight:900;color:#fff;text-align:center;margin-bottom:4px}
.intro-sub{font-size:12px;color:var(--mut);text-align:center;margin-bottom:22px;line-height:1.8}

/* name input */
.field-label{font-size:12px;color:var(--acc);margin-bottom:6px;font-weight:700;letter-spacing:.4px}
.name-input{width:100%;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);
  border-radius:12px;padding:12px 16px;font-size:14px;font-family:'Cairo',sans-serif;
  color:var(--txt);outline:none;transition:border-color .2s;margin-bottom:20px}
.name-input:focus{border-color:var(--acc)}
.name-input::placeholder{color:var(--mut)}

/* duration selector */
.dur-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.dpbtn{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.09);
  border-radius:10px;padding:10px 6px;cursor:pointer;text-align:center;
  font-family:'Cairo',sans-serif;color:var(--txt);transition:all .18s}
.dpbtn:hover{background:rgba(76,201,240,.08);border-color:rgba(76,201,240,.4)}
.dpbtn.sel{background:rgba(76,201,240,.14);border-color:var(--acc);color:#fff}
.dpbtn .dp-min{font-size:16px;font-weight:900;display:block;color:var(--acc)}
.dpbtn .dp-lbl{font-size:10px;color:var(--mut)}

/* custom duration */
.custom-row{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.custom-row input{flex:1;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.09);
  border-radius:10px;padding:10px 14px;font-size:14px;font-family:'Cairo',sans-serif;
  color:var(--txt);outline:none;transition:border-color .2s}
.custom-row input:focus{border-color:var(--acc)}
.custom-row span{font-size:12px;color:var(--mut);white-space:nowrap}

/* per-q preview */
.perq-box{background:rgba(76,201,240,.07);border:1px solid rgba(76,201,240,.25);
  border-radius:10px;padding:10px 14px;margin-bottom:20px;display:none;
  align-items:center;gap:10px}
.perq-box.show{display:flex}
.perq-emoji{font-size:22px;flex-shrink:0}
.perq-txt{font-size:12px;color:var(--txt);line-height:1.6}
.perq-val{color:var(--acc);font-weight:900;font-size:15px}

.start-btn{width:100%;background:linear-gradient(135deg,var(--acc),#0077b6);color:#fff;
  border:none;border-radius:13px;padding:14px;font-size:15px;font-weight:900;
  font-family:'Cairo',sans-serif;cursor:pointer;
  box-shadow:0 6px 24px rgba(76,201,240,.35);transition:all .2s;opacity:.5;pointer-events:none}
.start-btn.ready{opacity:1;pointer-events:auto}
.start-btn.ready:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(76,201,240,.45)}

/* ── QUIZ ── */
#quiz{padding:0}
.qhdr{background:var(--sf);border-bottom:1px solid rgba(255,255,255,.06);
  padding:10px 14px;position:sticky;top:0;z-index:50}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
.qctr{font-size:11px;color:var(--mut);white-space:nowrap}
.qctr strong{color:var(--acc);font-size:13px}
.hdr-name{font-size:11px;color:var(--grn);font-weight:700;
  background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);
  border-radius:20px;padding:2px 10px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:120px}
.streak{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.22);
  border-radius:20px;padding:2px 9px;transition:all .3s;white-space:nowrap}
.streak.hot{background:rgba(251,191,36,.2);box-shadow:0 0 12px rgba(251,191,36,.3)}
.pbar{height:4px;background:rgba(255,255,255,.06);border-radius:10px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--acc),#0077b6);border-radius:10px;transition:width .6s}

.qbody{flex:1;padding:13px;display:flex;flex-direction:column;gap:12px;
  max-width:680px;margin:0 auto;width:100%}

/* TIMER ROW */
.trow{display:flex;align-items:center;gap:12px;background:var(--sf);border-radius:13px;padding:11px 15px}
.tsvgw{position:relative;width:76px;height:76px;flex-shrink:0}
.tsvg{transform:rotate(-90deg)}
.tbg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:7}
.tarc{fill:none;stroke:var(--acc);stroke-width:7;stroke-linecap:round;
  stroke-dasharray:213.6;stroke-dashoffset:0;transition:stroke .4s}
.tnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:900}
.tinfo{flex:1;min-width:0}
.tunit{font-size:9px;color:var(--mut);margin-bottom:3px;letter-spacing:.3px}
.tscore{font-size:11px;font-weight:600}
.temoji{font-size:20px;flex-shrink:0;animation:floatE 1.8s ease-in-out infinite}

/* QUESTION */
.qbox{background:var(--sf);border-radius:13px;padding:16px;
  border:1px solid rgba(255,255,255,.06);animation:slideIn .35s cubic-bezier(.4,0,.2,1)}
.qtag{font-size:9px;color:var(--acc);letter-spacing:.3px;margin-bottom:7px}
.qtext{font-size:14px;line-height:1.9;font-weight:700;color:#fff}

/* CHOICES */
.choices{display:flex;flex-direction:column;gap:7px}
.cbtn{display:flex;align-items:flex-start;gap:10px;
  background:var(--sf);border:1.5px solid rgba(255,255,255,.07);
  border-radius:11px;padding:11px 12px;cursor:pointer;
  font-size:13px;color:var(--txt);font-family:'Cairo',sans-serif;
  text-align:right;line-height:1.6;transition:all .16s;width:100%}
.cbtn:hover:not(.locked){background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.18);transform:translateX(-2px)}
.cbtn.locked{cursor:default;transform:none!important}
.cbtn.selected{background:rgba(76,201,240,.09);border-color:rgba(76,201,240,.4)}
.cbtn.correct{background:rgba(74,222,128,.11);border-color:rgba(74,222,128,.5);animation:cpulse .4s ease}
.cbtn.wrong{background:rgba(248,113,113,.11);border-color:rgba(248,113,113,.5);animation:shk .4s ease}
.clbl{width:25px;height:25px;min-width:25px;border-radius:6px;
  background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:11px;color:var(--mut);transition:all .16s;flex-shrink:0;margin-top:2px}
.cbtn.selected .clbl{background:rgba(76,201,240,.22);color:var(--acc)}
.cbtn.correct .clbl{background:rgba(74,222,128,.28);color:var(--grn)}
.cbtn.wrong   .clbl{background:rgba(248,113,113,.28);color:var(--red)}

/* FEEDBACK */
#fb{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:200;pointer-events:none;opacity:0;transition:opacity .15s}
#fb.show{opacity:1}
.fbemoji{font-size:88px;animation:fbpop .45s cubic-bezier(.17,.67,.35,1.4)}

/* CONFETTI */
#conf{position:fixed;inset:0;pointer-events:none;z-index:180;overflow:hidden}
.cdot{position:absolute;top:-12px;border-radius:2px;animation:cfall 1.3s ease-in forwards}
@keyframes cfall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(540deg);opacity:0}}

/* RESULTS */
#results{align-items:center;padding:22px 16px 40px;overflow-y:auto;
  background:radial-gradient(ellipse at top,#1a1a3e 0%,var(--bg) 70%)}
.rinner{max-width:680px;width:100%}
.rtrophy{font-size:72px;text-align:center;display:block;animation:bounceIn .6s cubic-bezier(.17,.67,.35,1.3)}
.rscore{font-size:50px;font-weight:900;color:var(--acc);text-align:center;margin:5px 0}
.rname{text-align:center;font-size:14px;color:var(--grn);font-weight:700;margin-bottom:2px}
.rgrade{text-align:center;font-size:16px;font-weight:800;color:#fff;margin-bottom:3px}
.rdetail{text-align:center;font-size:11px;color:var(--mut);margin-bottom:22px;line-height:1.8}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.rcard{background:var(--sf);border-radius:11px;padding:11px;text-align:center;border:1px solid rgba(255,255,255,.07)}
.rcard .rv{font-size:22px;font-weight:900;margin-bottom:2px}
.rcard .rl{font-size:10px;color:var(--mut)}
.ubd{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.ubrow{background:var(--sf);border-radius:11px;padding:9px 13px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.06)}
.ubicon{font-size:17px;flex-shrink:0}
.ubinfo{flex:1;min-width:0}
.ubname{font-size:11px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubbar{height:4px;background:rgba(255,255,255,.07);border-radius:10px;overflow:hidden}
.ubfill{height:100%;border-radius:10px;transition:width .9s ease}
.ubsc{font-size:12px;font-weight:800;flex-shrink:0}
.retrybtn{width:100%;background:linear-gradient(135deg,var(--acc),#0077b6);color:#fff;
  border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:900;
  font-family:'Cairo',sans-serif;cursor:pointer;margin-top:4px;
  box-shadow:0 5px 18px rgba(76,201,240,.3);transition:transform .2s}
.retrybtn:hover{transform:translateY(-2px)}

/* ANIMATIONS */
@keyframes floatE{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:translateX(0)}}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes cpulse{0%{transform:scale(1)}50%{transform:scale(1.015)}100%{transform:scale(1)}}
@keyframes fbpop{from{transform:scale(.3) rotate(-15deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes bounceIn{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12)}80%{transform:scale(.96)}100%{transform:scale(1);opacity:1}}
@keyframes pulseglow{0%,100%{box-shadow:0 0 0 rgba(248,113,113,0)}50%{box-shadow:0 0 16px rgba(248,113,113,.4)}}
@keyframes sbounce{0%{transform:scale(1)}50%{transform:scale(1.22)}100%{transform:scale(1)}}
</style>
</head>
<body>

<!-- ════════════ INTRO ════════════ -->
<div class="screen active" id="intro">
  <div class="intro-card">
    <span class="intro-logo">🎓</span>
    <div class="intro-title">امتحان تكنولوجيا المعلومات</div>
    <div class="intro-sub">الصف الثامن الأساسي &nbsp;•&nbsp; 200 سؤال &nbsp;•&nbsp; 4 خيارات</div>

    <!-- Name -->
    <div class="field-label">👤 اسم الطالب</div>
    <input class="name-input" id="nameInput" type="text"
           placeholder="أدخل اسمك الكامل هنا..." oninput="checkReady()">

    <!-- Duration presets -->
    <div class="field-label">⏱ مدة الامتحان الكاملة</div>
    <div class="dur-presets" id="presets">
      <button class="dpbtn" onclick="pickDur(30,this)"><span class="dp-min">30</span><span class="dp-lbl">دقيقة</span></button>
      <button class="dpbtn" onclick="pickDur(45,this)"><span class="dp-min">45</span><span class="dp-lbl">دقيقة</span></button>
      <button class="dpbtn" onclick="pickDur(60,this)"><span class="dp-min">60</span><span class="dp-lbl">دقيقة</span></button>
      <button class="dpbtn" onclick="pickDur(90,this)"><span class="dp-min">90</span><span class="dp-lbl">دقيقة</span></button>
      <button class="dpbtn" onclick="pickDur(120,this)"><span class="dp-min">120</span><span class="dp-lbl">دقيقة</span></button>
      <button class="dpbtn" id="customBtn" onclick="toggleCustom(this)"><span class="dp-min">✏️</span><span class="dp-lbl">مخصص</span></button>
    </div>

    <!-- Custom input -->
    <div class="custom-row" id="customRow" style="display:none">
      <input type="number" id="customMin" min="10" max="300" placeholder="عدد الدقائق"
             oninput="pickDurCustom(this.value)">
      <span>دقيقة (10 – 300)</span>
    </div>

    <!-- Per-question preview -->
    <div class="perq-box" id="perqBox">
      <div class="perq-emoji">⚡</div>
      <div class="perq-txt">
        مدة الامتحان: <span id="pqTotal" class="perq-val">—</span> دقيقة
        &nbsp;|&nbsp;
        كل سؤال يحصل على <span id="pqSec" class="perq-val">—</span> ثانية
      </div>
    </div>

    <button class="start-btn" id="startBtn" onclick="startQuiz()">🚀 ابدأ الامتحان</button>
  </div>
</div>

<!-- ════════════ QUIZ ════════════ -->
<div class="screen" id="quiz">
  <div class="qhdr">
    <div class="hdr-top">
      <div class="qctr">سؤال <strong id="qnum">1</strong> / 200</div>
      <div class="hdr-name" id="hdrName"></div>
      <div class="streak" id="streak">⚡ <span id="sv">0</span> متتالي</div>
    </div>
    <div class="pbar"><div class="pfill" id="prog" style="width:0%"></div></div>
  </div>
  <div class="qbody">
    <div class="trow">
      <div class="tsvgw">
        <svg class="tsvg" viewBox="0 0 76 76" width="76" height="76">
          <circle class="tbg" cx="38" cy="38" r="32"/>
          <circle class="tarc" id="tarc" cx="38" cy="38" r="32"/>
        </svg>
        <div class="tnum" id="tnum">—</div>
      </div>
      <div class="tinfo">
        <div class="tunit" id="tunit">الوحدة الأولى</div>
        <div class="tscore" id="lscore">✅ 0 صحيح &nbsp;|&nbsp; ❌ 0 خطأ</div>
      </div>
      <div class="temoji" id="temoji">⏳</div>
    </div>
    <div class="qbox" id="qbox">
      <div class="qtag" id="qtag">💻 الوحدة الأولى</div>
      <div class="qtext" id="qtext">...</div>
    </div>
    <div class="choices" id="choices"></div>
  </div>
</div>

<!-- ════════════ RESULTS ════════════ -->
<div class="screen" id="results">
  <div class="rinner">
    <span class="rtrophy" id="rtrophy">🏆</span>
    <div class="rscore" id="rscore">0/200</div>
    <div class="rname" id="rname"></div>
    <div class="rgrade" id="rgrade"></div>
    <div class="rdetail" id="rdetail"></div>
    <div class="rgrid" id="rgrid"></div>
    <div class="ubd" id="ubd"></div>
    <button class="retrybtn" onclick="location.reload()">🔄 إعادة الامتحان</button>
  </div>
</div>

<div id="fb"><div class="fbemoji" id="fbemoji"></div></div>
<div id="conf"></div>

<script>
const UNITS=[
  {name:"بنية الحاسوب وأنظمة العد",icon:"💻",color:"#4cc9f0"},
  {name:"تحرير الصور والفيديو",icon:"🖼️",color:"#4ade80"},
  {name:"الشبكات والإنترنت",icon:"🌐",color:"#f472b6"},
  {name:"البرمجة C++",icon:"⌨️",color:"#fbbf24"},
  {name:"استثمار التطبيقات",icon:"🛠️",color:"#34d399"},
  {name:"الإثراء",icon:"🚀",color:"#f87171"}
];
const LABELS=["أ","ب","ج","د"];

  document.getElementById('customMin').value='';

function toggleCustom(btn){
  const row=document.getElementById('customRow');
  const open=row.style.display==='flex';
  row.style.display=open?'none':'flex';
  if(open){totalMin=0;QTIME=0;hidePreview();checkReady();}
  setDurBtn(open?null:btn);
}

  const v=parseInt(val);
  if(v>=10 && v<=300){totalMin=v;QTIME=Math.floor(v*60/200);showPreview();}
  else{totalMin=0;QTIME=0;hidePreview();}
  checkReady();
}

function setDurBtn(btn){
  if(activeDurBtn) activeDurBtn.classList.remove('sel');
  activeDurBtn=btn;
  if(btn) btn.classList.add('sel');
  checkReady();
}

function showPreview(){
  const box=document.getElementById('perqBox');
  document.getElementById('pqTotal').textContent=totalMin;
  document.getElementById('pqSec').textContent=QTIME;
  box.classList.add('show');
  checkReady();
}
function hidePreview(){document.getElementById('perqBox').classList.remove('show')}

function checkReady(){
  const name=document.getElementById('nameInput').value.trim();
  const ok=name.length>=2 && QTIME>0;
  const btn=document.getElementById('startBtn');
  btn.classList.toggle('ready',ok);
}

// ── START ──────────────────────────────────────────────────────────────
function startQuiz(){
  studentName=document.getElementById('nameInput').value.trim();
  if(!studentName || QTIME<=0) return;
  document.getElementById('hdrName').textContent='👤 '+studentName;
  showScreen('quiz'); render();
}

// ── SCREENS ────────────────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── RENDER ─────────────────────────────────────────────────────────────
function render(){
  if(cur>=Q.length){showResults();return;}
  const q=Q[cur], u=UNITS[q.u];
  selected=-1; locked=false;
  document.getElementById('qnum').textContent=cur+1;
  document.getElementById('prog').style.width=(cur/200*100)+'%';
  document.getElementById('tunit').textContent=u.icon+' '+u.name;
  document.getElementById('qtag').textContent=u.icon+' '+u.name;
  document.getElementById('qtag').style.color=u.color;
  updateStreak(); updateLS();
  const qb=document.getElementById('qbox');
  qb.style.animation='none'; qb.offsetHeight; qb.style.animation='slideIn .35s cubic-bezier(.4,0,.2,1)';
  document.getElementById('qtext').textContent=q.q;
  const ch=document.getElementById('choices');
  ch.style.animation='none'; ch.offsetHeight; ch.style.animation='slideIn .4s cubic-bezier(.4,0,.2,1)';
  ch.innerHTML='';
  q.c.forEach((txt,i)=>{
    const b=document.createElement('button'); b.className='cbtn'; b.id='c'+i;
    b.innerHTML='<span class="clbl">'+LABELS[i]+'</span>'+txt;
    b.onclick=()=>pick(i); ch.appendChild(b);
  });
  startTimer();
}

// ── TIMER ──────────────────────────────────────────────────────────────
function startTimer(){
  clearInterval(timerID); timerVal=QTIME; updateT();
  // smooth animation: update every 100ms for fluid arc
  let elapsed=0;
  timerID=setInterval(()=>{
    elapsed+=100;
    const remaining=Math.ceil((QTIME*1000-elapsed)/1000);
    if(remaining!==timerVal){timerVal=Math.max(0,remaining);updateT();}
    if(elapsed>=QTIME*1000){clearInterval(timerID);timerVal=0;updateT();onTimeout();}
  },100);
}

function updateT(){
  const arc=document.getElementById('tarc');
  const num=document.getElementById('tnum');
  const em=document.getElementById('temoji');
  const frac=(QTIME-timerVal)/QTIME;          // 0=full … 1=empty
  const offset=CIRC*frac;
  arc.style.strokeDashoffset=offset;
  num.textContent=timerVal;
  const pct=timerVal/QTIME;
  if(pct>0.4){
    arc.style.stroke='#4cc9f0'; num.style.color=''; em.textContent='⏳';
    document.querySelector('.tsvgw').style.animation='none';
  } else if(pct>0.2){
    arc.style.stroke='#fbbf24'; num.style.color='#fbbf24'; em.textContent='⚡';
  } else {
    arc.style.stroke='#f87171'; num.style.color='#f87171'; em.textContent='🚨';
    document.querySelector('.tsvgw').style.animation='pulseglow .55s ease infinite';
  }
}

// ── PICK ───────────────────────────────────────────────────────────────
function pick(i){
  if(locked)return;
  for(let k=0;k<4;k++){const b=document.getElementById('c'+k);if(b)b.classList.remove('selected');}
  selected=i; document.getElementById('c'+i)?.classList.add('selected');
}

// ── TIMEOUT → evaluate → advance ───────────────────────────────────────
function onTimeout(){
  if(locked)return; locked=true;
  const correct=Q[cur].a, ui=Q[cur].u;
  const ok=(selected===correct);
  usc[ui].t++;
  for(let k=0;k<4;k++){
    const b=document.getElementById('c'+k); if(!b)continue;
    b.classList.add('locked'); b.classList.remove('selected');
    if(k===correct) b.classList.add('correct');
    else if(k===selected) b.classList.add('wrong');
  }
  if(ok){score++;streak++;if(streak>maxStreak)maxStreak=streak;usc[ui].c++;showFB('🎉');confetti();}
  else{streak=0; showFB(selected===-1?'⏰':'😢');}
  document.querySelector('.tsvgw').style.animation='none';
  updateStreak(); updateLS();
  setTimeout(()=>{hideFB();cur++;render();},1400);
}

// ── HELPERS ────────────────────────────────────────────────────────────
function showFB(e){document.getElementById('fbemoji').textContent=e;document.getElementById('fb').classList.add('show');}
function hideFB(){document.getElementById('fb').classList.remove('show');}

function confetti(){
  const ct=document.getElementById('conf');
  const cols=['#4cc9f0','#4ade80','#fbbf24','#f472b6','#c084fc'];
  for(let i=0;i<20;i++){
    const d=document.createElement('div'); d.className='cdot';
    d.style.left=Math.random()*100+'%';
    d.style.background=cols[Math.floor(Math.random()*cols.length)];
    d.style.animationDelay=Math.random()*.35+'s';
    d.style.animationDuration=(.8+Math.random()*.55)+'s';
    const sz=5+Math.random()*8+'px'; d.style.width=sz; d.style.height=sz;
    d.style.borderRadius=Math.random()>.5?'50%':'2px';
    ct.appendChild(d); setTimeout(()=>d.remove(),1600);
  }
}

function updateStreak(){
  const s=document.getElementById('streak');
  if(streak>=5){s.classList.add('hot');s.innerHTML='🔥🔥 <span id="sv">'+streak+'</span> متتالي';s.style.animation='sbounce .3s ease';setTimeout(()=>s.style.animation='',300);}
  else if(streak>=3){s.classList.add('hot');s.innerHTML='🔥 <span id="sv">'+streak+'</span> متتالي';}
  else{s.classList.remove('hot');s.innerHTML='⚡ <span id="sv">'+streak+'</span> متتالي';}
}
function updateLS(){
  document.getElementById('lscore').textContent='✅ '+score+' صحيح  |  ❌ '+Math.max(0,cur-score)+' خطأ';
}

// ── RESULTS ────────────────────────────────────────────────────────────
function showResults(){
  showScreen('results');
  const pct=Math.round(score/200*100);
  let grade,trophy;
  if(pct>=90){grade='ممتاز 🌟';trophy='🏆';}
  else if(pct>=80){grade='جيد جداً 🥇';trophy='🥇';}
  else if(pct>=70){grade='جيد 🥈';trophy='🥈';}
  else if(pct>=60){grade='مقبول 🥉';trophy='🥉';}
  else{grade='بحاجة للمراجعة 📚';trophy='📚';}
  document.getElementById('rtrophy').textContent=trophy;
  document.getElementById('rscore').textContent=score+'/200';
  document.getElementById('rname').textContent='👤 '+studentName;
  document.getElementById('rgrade').textContent=grade;
  document.getElementById('rdetail').textContent=
    'مدة الامتحان: '+totalMin+' دقيقة  •  '+QTIME+' ثانية/سؤال  •  دقة الإجابة: '+pct+'%  •  أطول سلسلة: '+maxStreak+' 🔥';
  document.getElementById('rgrid').innerHTML=
    '<div class="rcard"><div class="rv" style="color:#4ade80">'+score+'</div><div class="rl">إجابة صحيحة</div></div>'+
    '<div class="rcard"><div class="rv" style="color:#f87171">'+(200-score)+'</div><div class="rl">إجابة خاطئة</div></div>'+
    '<div class="rcard"><div class="rv" style="color:#fbbf24">'+pct+'%</div><div class="rl">الدقة</div></div>'+
    '<div class="rcard"><div class="rv" style="color:#c084fc">'+maxStreak+'</div><div class="rl">أطول سلسلة 🔥</div></div>';
  const bd=document.getElementById('ubd'); bd.innerHTML='';
  UNITS.forEach((u,i)=>{
    const {c,t}=usc[i], p=t>0?Math.round(c/t*100):0;
    const row=document.createElement('div'); row.className='ubrow';
    row.innerHTML='<div class="ubicon">'+u.icon+'</div>'+
      '<div class="ubinfo"><div class="ubname" style="color:'+u.color+'">'+u.name+'</div>'+
      '<div class="ubbar"><div class="ubfill" style="width:'+p+'%;background:'+u.color+'"></div></div></div>'+
      '<div class="ubsc" style="color:'+u.color+'">'+c+'/'+t+'</div>';
    bd.appendChild(row);
  });
  if(pct>=70){confetti();setTimeout(confetti,400);}
}
</script>
</body>
</html>
